<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VGWifi - Live Voucher Printer</title>
    <link rel="icon" type="image/png" sizes="48x40" href="favicon.png">
    
    <!-- Include Firebase Compat Modules (Only App & Database needed now) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        /* --- Dashboard Styling (Firebase Console Dark Mode Style) --- */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        
        /* --- Login Card Container --- */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .login-card {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            padding: 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            text-align: center;
        }
        .login-card h2 {
            color: #ffffff;
            font-weight: 400;
            margin-bottom: 25px;
            font-size: 22px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #a8a8a8;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-group input {
            width: 100%;
            padding: 10px 12px;
            background-color: #121212;
            border: 1px solid #3d3d3d;
            border-radius: 4px;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            outline: none;
            border-color: #ffca28;
        }
        .login-btn {
            width: 100%;
            background-color: #ffca28;
            color: #121212;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .login-btn:hover {
            background-color: #ffe082;
        }
        .error-msg {
            color: #ff5252;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }

        /* --- Main App Container --- */
        .database-container {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: none; /* Controlled via Local Auth State */
        }
        .header {
            border-bottom: 1px solid #2d2d2d;
            padding-bottom: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 24px;
            font-weight: 400;
            margin: 0;
            color: #ffffff;
        }
        .logout-btn {
            background-color: transparent;
            color: #a8a8a8;
            border: 1px solid #3d3d3d;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .logout-btn:hover {
            color: #ffffff;
            border-color: #ff5252;
            background-color: rgba(255, 82, 82, 0.1);
        }
        .db-url {
            font-family: monospace;
            color: #a8a8a8;
            font-size: 14px;
            padding-bottom: 15px;
            border-bottom: 1px solid #2d2d2d;
            margin-bottom: 15px;
        }
        
        /* --- Collapsible Accordion Styling --- */
        .tier-wrapper {
            margin-bottom: 10px;
            border: 1px solid #2d2d2d;
            border-radius: 4px;
            overflow: hidden;
        }
        .tier-header {
            background-color: #252525;
            padding: 12px 15px;
            font-size: 15px;
            font-weight: bold;
            color: #ffca28;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            transition: background 0.2s;
        }
        .tier-header:hover {
            background-color: #2d2d2d;
        }
        .tier-header::before {
            content: "▶";
            display: inline-block;
            margin-right: 10px;
            font-size: 11px;
            color: #a8a8a8;
            transition: transform 0.2s;
        }
        .tier-wrapper.active .tier-header::before {
            transform: rotate(90deg);
            color: #ffca28;
        }
        .tier-count {
            font-size: 12px;
            background-color: #383838;
            color: #a8a8a8;
            padding: 2px 8px;
            border-radius: 10px;
            font-family: sans-serif;
        }
        .tier-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.2s ease-out;
            background-color: #1a1a1a;
        }
        .voucher-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .voucher-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            border-bottom: 1px solid #252525;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
        }
        .voucher-item:last-child {
            border-bottom: none;
        }
        .voucher-item:hover {
            background-color: #222222;
        }
        .key {
            color: #80cbc4;
        }
        .val {
            color: #ff8a65;
            font-weight: bold;
        }
        .print-btn {
            background-color: #00796b;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-family: sans-serif;
            font-size: 12px;
            transition: background 0.2s;
        }
        .print-btn:hover {
            background-color: #009688;
        }

        /* --- Strict Thermal Receipt Print Layout Mapping --- */
        @media print {
            body * {
                display: none !important;
            }
            #print-receipt-area, #print-receipt-area * {
                display: block !important;
            }
            #print-receipt-area {
                position: relative; 
                width: 58mm;
                background: white !important;
                color: black !important;
                font-family: monospace !important;
                padding: 0;
                margin: 0;
            }
            .receipt-ticket {
                width: 58mm;
                text-align: center !important; 
                display: flex;
                flex-direction: column;
                align-items: center; 
                justify-content: flex-start;
                padding: 6px 0px 12px 0px;  
                box-sizing: border-box;
                margin-left: -10mm !important; /* Your dialed-in custom offset hardware fix */
            }
            .receipt-logo {
                width: 45%; 
                max-width: 130px;
                height: auto;
                margin: 0 auto 4px auto;
                display: block;
                filter: contrast(200%) brightness(100%);
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .receipt-label {
                font-size: 13px; 
                font-weight: bold;
                margin-top: 4px;
                margin-bottom: 2px;
                text-align: center;
                width: 100%;
            }
            .receipt-code {
                font-size: 28px; 
                font-weight: bold;
                margin-bottom: 4px;
                letter-spacing: 1px;
                text-align: center;
                width: 100%;
            }
            .receipt-details {
                font-size: 15px; 
                font-weight: bold;
                margin-bottom: 6px;
                text-align: center;
                width: 100%;
            }
            .receipt-timestamp {
                font-size: 9px; 
                color: #000;
                text-align: center;
                width: 100%;
                margin-top: 2px;
                display: block !important;
            }
        }
    </style>
</head>
<body>

    <!-- LOCAL LOGIN BOX PANEL -->
    <div id="login-panel" class="login-container">
        <div class="login-card">
            <h2>VGWifi Portal Sign In</h2>
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="admin">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key === 'Enter') handleLogin()">
            </div>
            <button class="login-btn" onclick="handleLogin()">Login to Monitor</button>
            <div id="error-message" class="error-msg">Invalid Username or Password.</div>
        </div>
    </div>

    <!-- MAIN CONTROL APP PANEL (Hidden initially) -->
    <div id="app-panel" class="database-container">
        <div class="header">
            <h1>Realtime Database Monitor</h1>
            <button class="logout-btn" onclick="handleLogout()">Sign Out</button>
        </div>
        <div class="db-url">https://vgwifi-a5e90-default-rtdb.asia-southeast1.firebasedatabase.app</div>
        
        <div id="tiers-accordion-container">
            <div style="color: #888; padding: 10px;">Connecting to Firebase...</div>
        </div>
    </div>

    <div id="print-receipt-area" style="display: none;"></div>

    <script>
        // --- 🔐 CHANGE YOUR LOG IN CREDENTIALS HERE ---
        const ADMIN_USERNAME = "admin";
        const ADMIN_PASSWORD = "135908billy"; 

        // Firebase initialization configuration block
        const firebaseConfig = {
            apiKey: "AIzaSyBwWuCJSjQLnIK46UVr5C3OdV__ZPL6od4",
            authDomain: "vgwifi-a5e90.firebaseapp.com",
            databaseURL: "https://vgwifi-a5e90-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "vgwifi-a5e90",
            storageBucket: "vgwifi-a5e90.firebasestorage.app",
            messagingSenderId: "681264447950",
            appId: "1:681264447950:web:96a320578b257880086b9f"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const tierFormats = {
            "P05V": "30 MINS (P5.00)",
            "P10V": "1 HOUR (P10.00)",
            "P15V": "3 HRS (P15.00)",
            "P20V": "15 HRS (P20.00)",
            "P25V": "1 DAY (P25.00)",
            "P35V": "3 DAYS (P35.00)",
            "P50V": "7 DAYS (P50.00)"
        };
        const targetTiers = Object.keys(tierFormats);
        let dbRef = null; 

        // Check for active session when page loads
        window.onload = function() {
            if (sessionStorage.getItem("vgwifi_logged_in") === "true") {
                showDashboard();
            } else {
                showLogin();
            }
        };

        // Local Authentication check
        function handleLogin() {
            const userIn = document.getElementById('username').value;
            const passIn = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            
            if (userIn === ADMIN_USERNAME && passIn === ADMIN_PASSWORD) {
                errorDiv.style.display = 'none';
                sessionStorage.setItem("vgwifi_logged_in", "true");
                showDashboard();
            } else {
                errorDiv.style.display = 'block';
            }
        }

        function handleLogout() {
            sessionStorage.removeItem("vgwifi_logged_in");
            showLogin();
        }

        function showDashboard() {
            document.getElementById('login-panel').style.display = 'none';
            document.getElementById('app-panel').style.display = 'block';
            startDatabaseSync();
        }

        function showLogin() {
            if (dbRef) database.ref().off('value', dbRef);
            document.getElementById('tiers-accordion-container').innerHTML = '';
            document.getElementById('app-panel').style.display = 'none';
            document.getElementById('login-panel').style.display = 'flex';
        }

        /* --- Continuous Database Synchronizer Stream Engine --- */
        function startDatabaseSync() {
            dbRef = database.ref().on('value', (snapshot) => {
                const mainContainer = document.getElementById('tiers-accordion-container');
                
                const openTiers = {};
                document.querySelectorAll('.tier-wrapper.active').forEach(el => {
                    openTiers[el.dataset.tier] = true;
                });

                mainContainer.innerHTML = ''; 
                const rootData = snapshot.val() || {};

                targetTiers.forEach((tierName) => {
                    const tierData = rootData[tierName] || {};
                    const keys = Object.keys(tierData);
                    const count = keys.length;

                    const wrapper = document.createElement('div');
                    wrapper.className = 'tier-wrapper';
                    wrapper.dataset.tier = tierName;
                    if (openTiers[tierName]) wrapper.classList.add('active');

                    const header = document.createElement('div');
                    header.className = 'tier-header';
                    header.innerHTML = `<span>${tierName} — <small style="color:#aaa; font-weight:normal;">${tierFormats[tierName]}</small></span> <span class="tier-count">${count} items</span>`;
                    
                    const content = document.createElement('div');
                    content.className = 'tier-content';

                    const ul = document.createElement('ul');
                    ul.className = 'voucher-list';

                    if (count === 0) {
                        ul.innerHTML = `<li class="voucher-item" style="color: #666; justify-content: center;">No active vouchers</li>`;
                    } else {
                        keys.forEach((key) => {
                            const voucherCode = tierData[key];
                            const li = document.createElement('li');
                            li.className = 'voucher-item';
                            li.innerHTML = `
                                <div>
                                    <span class="key">${key}:</span> 
                                    <span class="val">"${voucherCode}"</span>
                                </div>
                                <button class="print-btn" onclick="event.stopPropagation(); printAndDropVoucher('${tierName}', '${key}', '${voucherCode}')">Print</button>
                            `;
                            ul.appendChild(li);
                        });
                    }

                    content.appendChild(ul);
                    wrapper.appendChild(header);
                    wrapper.appendChild(content);
                    mainContainer.appendChild(wrapper);

                    if (openTiers[tierName]) {
                        content.style.maxHeight = content.scrollHeight + "px";
                    }

                    header.addEventListener('click', () => {
                        const isActive = wrapper.classList.toggle('active');
                        if (isActive) {
                            content.style.maxHeight = content.scrollHeight + "px";
                        } else {
                            content.style.maxHeight = "0px";
                        }
                    });
                });
            }, (error) => {
                console.error(error);
                document.getElementById('tiers-accordion-container').innerHTML = `<div style="color: #ff5252; padding: 10px;">Error: ${error.message}</div>`;
            });
        }

        /* --- Formatted Print Engine Execution --- */
        function printAndDropVoucher(tier, key, code) {
            const printArea = document.getElementById('print-receipt-area');
            const formatString = tierFormats[tier] || "";

            const now = new Date();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const yyyy = now.getFullYear();
            
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const dayName = days[now.getDay()];
            
            const timeStr = now.toTimeString().split(' ')[0];
            const customTimestamp = `${mm}-${dd}-${yyyy} (${dayName}) ${timeStr}`;

            printArea.innerHTML = `
                <div class="receipt-ticket">
                    <img class="receipt-logo" src="logo.png" alt="VG Wifi Logo">
                    <div class="receipt-label">Voucher Code:</div>
                    <div class="receipt-code">${code}</div>
                    <div class="receipt-details">${formatString}</div>
                    <div class="receipt-timestamp">${customTimestamp}</div>
                </div>
            `;

            setTimeout(() => {
                window.print();

                const priceMatch = formatString.match(/\(([^)]+)\)/);
                const priceLabel = priceMatch ? priceMatch[1] : tier; 
                const logTimestamp = `${mm}-${dd}-${yyyy}-${timeStr}`;
                const logMessage = `${logTimestamp}: [${priceLabel}] voucher ("${code}") manually printed and issued;`;

                const months = ["01-January", "02-February", "03-March", "04-April", "05-May", "06-June", "07-July", "08-August", "09-September", "10-October", "11-November", "12-December"];
                const monthFolder = months[now.getMonth()];
                const dateFolder = `${mm}-${dd}-${yyyy}`;
                const logPath = `/logs/${yyyy}/${monthFolder}/${dateFolder}`;

                database.ref(logPath).push(logMessage)
                    .then(() => {
                        return database.ref(`${tier}/${key}`).remove();
                    })
                    .catch((error) => {
                        alert(`Process encountered an issue: ${error.message}`);
                    });
            }, 250);
        }
    </script>
</body>
</html>
