<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VGWifi Voucher Printer</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        /* --- Dashboard Styling (Firebase Console Dark Mode Style) --- */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .header {
            border-bottom: 1px solid #2d2d2d;
            padding-bottom: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 24px;
            font-weight: 400;
            margin: 0;
            color: #ffffff;
        }
        .database-container {
            display: none; /* Hidden until authenticated */
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .db-url {
            font-family: monospace;
            color: #a8a8a8;
            font-size: 14px;
            padding-bottom: 15px;
            border-bottom: 1px solid #2d2d2d;
            margin-bottom: 15px;
        }
        
        /* --- Login Screen Styling --- */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .login-card {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            padding: 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        .login-card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #ffffff;
            font-weight: 400;
            font-size: 22px;
        }
        .login-form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .login-form-group label {
            display: block;
            font-size: 13px;
            color: #a8a8a8;
            margin-bottom: 6px;
        }
        .login-input {
            width: 100%;
            box-sizing: border-box;
            background-color: #121212;
            border: 1px solid #3d3d3d;
            border-radius: 4px;
            padding: 10px 12px;
            color: #ffffff;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .login-input:focus {
            outline: none;
            border-color: #027dfe;
        }
        .login-btn {
            width: 100%;
            background-color: #027dfe;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }
        .login-btn:hover {
			color: #000000;
            background-color: #b3e620;
        }
        .login-btn:active {
            transform: scale(0.98);
        }
        .login-error {
            color: #ff5252;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }
        .logout-btn {
            background-color: transparent;
            color: #a8a8a8;
            border: 1px solid #3d3d3d;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s, color 0.2s;
        }
        .logout-btn:hover {
            background-color: #2d2d2d;
            color: #ff5252;
            border-color: #ff5252;
        }

        /* --- Reverted: Voucher Control Panel Interface Layout --- */
        .control-panel {
            background-color: #1a1a1a;
            border: 1px solid #2d2d2d;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .form-row {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        @media (min-width: 600px) {
            .form-row {
                flex-direction: row;
                align-items: flex-end;
            }
            .form-group-flex {
                flex: 1;
            }
        }
        .control-label {
            display: block;
            font-size: 14px;
            color: #6ec2e1;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .dropdown-select {
            width: 100%;
            box-sizing: border-box;
            background-color: #252525;
            border: 1px solid #3d3d3d;
            border-radius: 4px;
            padding: 10px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .dropdown-select:focus {
            border-color: #027dfe;
        }
        .code-container-box {
            background-color: #121212;
            border: 1px solid #3d3d3d;
            border-radius: 4px;
            padding: 10px 12px;
            min-height: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
        }
        .key-display {
            color: #80cbc4;
        }
        .val-display {
            color: #ff8a65;
            font-weight: bold;
        }
        .action-container {
            text-align: right;
        }
        .print-btn {
            background-color: #6ec2e1;
            color: black;
            border: none;
            padding: 10px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-family: sans-serif;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .print-btn:hover {
            background-color: #2c4d5a;
			color: #c5e6f3;
        }
        .print-btn:disabled {
            background-color: #383838;
            color: #666666;
            cursor: not-allowed;
        }

        /* --- Strict Thermal Receipt Print Layout Mapping --- */
        @media print {
            @page {
                size: 58mm auto;
                margin: 0 !important; 
            }

            body * {
                display: none !important;
            }
            #print-receipt-area, #print-receipt-area * {
                display: block !important;
            }
            #print-receipt-area {
                position: relative; 
                width: 58mm;
                background: white !important;
                color: black !important;
                font-family: monospace !important;
                padding: 0;
                margin: 0;
            }
            .receipt-ticket {
                width: 58mm;
                text-align: center !important; 
                display: flex;
                flex-direction: column;
                align-items: center; 
                justify-content: flex-start;
                padding: 6px 0px 12px 0px;  
                box-sizing: border-box;
                margin-left: -10mm !important; 
            }
            .receipt-logo {
                width: 45%; 
                max-width: 130px;
                height: auto;
                margin: 0 auto 4px auto;
                display: block;
                filter: contrast(200%) brightness(100%);
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .receipt-label {
                font-size: 13px; 
                font-weight: bold;
                margin-top: 4px;
                margin-bottom: 2px;
                text-align: center;
                width: 100%;
            }
            .receipt-code {
                font-size: 25px; 
                font-weight: bold;
                margin-bottom: 4px;
                letter-spacing: 1px;
                text-align: center;
                width: 100%;
            }
            .receipt-details {
                font-size: 12px; 
                font-weight: bold;
                margin-bottom: 6px;
                text-align: center;
                width: 100%;
            }
            .receipt-timestamp {
                font-size: 9px; 
                color: #000;
                text-align: center;
                width: 100%;
                margin-top: 2px;
                display: block !important; 
            }
        }
    </style>
</head>
<body>

    <div id="login-container" class="login-wrapper">
        <div class="login-card">
            <h2>VGWifi Admin Portal</h2>
            <div class="login-form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="login-input" placeholder="Enter username" autocomplete="off">
            </div>
            <div class="login-form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="login-input" placeholder="Enter password">
            </div>
            <button class="login-btn" onclick="handleLogin()">Sign In</button>
            <div id="login-error-msg" class="login-error">Invalid credentials. Try again.</div>
        </div>
    </div>

    <div id="dashboard-container" class="database-container">
        <div class="header">
            <h1>VGWifi Voucher Database Printer</h1>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>
        <div class="db-url">https://vgwifi-a5e90-default-rtdb.asia-southeast1.firebasedatabase.app</div>
        
        <div class="control-panel">
            <div class="form-row">
                <div class="form-group-flex">
                    <label class="control-label" for="tier-select">Select Voucher Tier</label>
                    <select id="tier-select" class="dropdown-select" onchange="updateSelectedVoucherDisplay()">
                        <option value="">Loading tiers...</option>
                    </select>
                </div>
                <div class="form-group-flex">
                    <label class="control-label">Available Code:</label>
                    <div id="code-display-box" class="code-container-box">
                        <span style="color: #666;">No tier selected</span>
                    </div>
                </div>
            </div>
            <div class="action-container">
                <button id="master-print-btn" class="print-btn" disabled onclick="executeVoucherPrint()">Print Voucher</button>
            </div>
        </div>
    </div>

    <div id="print-receipt-area" style="display: none;"></div>

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Exact format mapping text definitions
        const tierFormats = {
			"P00V": "TEST VOUCHER",
            "P05V": "30 MINS (P5.00)",
            "P10V": "1 HOUR (P10.00)",
            "P15V": "3 HRS (P15.00)",
            "P20V": "15 HRS (P20.00)",
            "P25V": "1 DAY (P25.00)",
            "P35V": "3 DAYS (P35.00)",
            "P50V": "7 DAYS (P50.00)"
        };

        const targetTiers = Object.keys(tierFormats);
        let cachedDatabaseSnapshot = {}; 

        // --- AUTHENTICATION ENGINES ---
        function checkSession() {
            if (sessionStorage.getItem("vgwifi_authenticated") === "true") {
                document.getElementById("login-container").style.display = "none";
                document.getElementById("dashboard-container").style.display = "block";
                initializeDataSync();
            }
        }

        function handleLogin() {
            const userIn = document.getElementById("username").value;
            const passIn = document.getElementById("password").value;
            const errorMsg = document.getElementById("login-error-msg");

            if (userIn === AUTH_USER && passIn === AUTH_PASS) {
                errorMsg.style.display = "none";
                sessionStorage.setItem("vgwifi_authenticated", "true");
                document.getElementById("login-container").style.display = "none";
                document.getElementById("dashboard-container").style.display = "block";
                initializeDataSync();
            } else {
                errorMsg.style.display = "block";
                document.getElementById("password").value = "";
            }
        }

        function handleLogout() {
            sessionStorage.removeItem("vgwifi_authenticated");
            window.location.reload();
        }

        // Add Enter Key execution listeners to login inputs
        document.getElementById("password").addEventListener("keyup", function(event) {
            if (event.key === "Enter") handleLogin();
        });
        document.getElementById("username").addEventListener("keyup", function(event) {
            if (event.key === "Enter") handleLogin();
        });

        // --- FIREBASE DATA SYNC ENGINE ---
        function initializeDataSync() {
            database.ref().on('value', (snapshot) => {
                cachedDatabaseSnapshot = snapshot.val() || {};
                
                const selectElement = document.getElementById('tier-select');
                const previousSelection = selectElement.value;
                
                selectElement.innerHTML = '<option value="" disabled>-- Select a Voucher Tier --</option>';

                targetTiers.forEach((tierName) => {
                    const tierData = cachedDatabaseSnapshot[tierName] || {};
                    const count = Object.keys(tierData).length;
                    
                    const option = document.createElement('option');
                    option.value = tierName;
                    option.textContent = `${tierFormats[tierName]} (${count} items)`;
                    selectElement.appendChild(option);
                });

                if (previousSelection && targetTiers.includes(previousSelection)) {
                    selectElement.value = previousSelection;
                } else {
                    selectElement.value = "";
                }

                updateSelectedVoucherDisplay();

            }, (error) => {
                console.error(error);
                document.getElementById('code-display-box').innerHTML = `<div style="color: #ff5252;">Error: ${error.message}</div>`;
            });
        }

        // Updates UI elements inside preferred code field container
        function updateSelectedVoucherDisplay() {
            const selectElement = document.getElementById('tier-select');
            const codeDisplayBox = document.getElementById('code-display-box');
            const masterPrintBtn = document.getElementById('master-print-btn');
            
            const selectedTier = selectElement.value;

            if (!selectedTier) {
                codeDisplayBox.innerHTML = `<span style="color: #666;">No tier selected</span>`;
                masterPrintBtn.disabled = true;
                return;
            }

            const tierData = cachedDatabaseSnapshot[selectedTier] || {};
            const keys = Object.keys(tierData);

            if (keys.length === 0) {
                codeDisplayBox.innerHTML = `<span style="color: #ff5252; font-weight: bold;">No active vouchers</span>`;
                masterPrintBtn.disabled = true;
            } else {
                const nextKey = keys[0];
                const nextVoucherCode = tierData[nextKey];
                
                codeDisplayBox.innerHTML = `
                    <div>
                        <span class="val-display">${nextVoucherCode}</span>
                    </div>
                `;
                masterPrintBtn.disabled = false;
            }
        }

        function executeVoucherPrint() {
            const selectedTier = document.getElementById('tier-select').value;
            if (!selectedTier) return;

            const tierData = cachedDatabaseSnapshot[selectedTier] || {};
            const keys = Object.keys(tierData);
            if (keys.length === 0) return;

            const nextKey = keys[0];
            const nextVoucherCode = tierData[nextKey];

            printAndDropVoucher(selectedTier, nextKey, nextVoucherCode);
        }
