<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        /* --- Dashboard Styling (Firebase Console Dark Mode Style) --- */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .header {
            border-bottom: 1px solid #2d2d2d;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 {
            font-size: 24px;
            font-weight: 400;
            margin: 0;
            color: #ffffff;
        }
        .database-container {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .db-url {
            font-family: monospace;
            color: #a8a8a8;
            font-size: 14px;
            padding-bottom: 15px;
            border-bottom: 1px solid #2d2d2d;
            margin-bottom: 15px;
        }
        
        /* --- Collapsible Accordion Styling --- */
        .tier-wrapper {
            margin-bottom: 10px;
            border: 1px solid #2d2d2d;
            border-radius: 4px;
            overflow: hidden;
        }
        .tier-header {
            background-color: #252525;
            padding: 12px 15px;
            font-size: 15px;
            font-weight: bold;
            color: #c9ff28;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            transition: background 0.2s;
        }
        .tier-header:hover {
            background-color: #2d2d2d;
        }
        .tier-header::before {
            content: "▶";
            display: inline-block;
            margin-right: 10px;
            font-size: 11px;
            color: #a8a8a8;
            transition: transform 0.2s;
        }
        .tier-wrapper.active .tier-header::before {
            transform: rotate(90deg);
            color: #c9ff28;
        }
        .tier-count {
            font-size: 12px;
            background-color: #383838;
            color: #a8a8a8;
            padding: 2px 8px;
            border-radius: 10px;
            font-family: sans-serif;
        }
        .tier-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.2s ease-out;
            background-color: #1a1a1a;
        }
        .voucher-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .voucher-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            border-bottom: 1px solid #252525;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
        }
        .voucher-item:last-child {
            border-bottom: none;
        }
        .voucher-item:hover {
            background-color: #222222;
        }
        .key {
            color: #80cbc4;
        }
        .val {
            color: #ff8a65;
            font-weight: bold;
        }
        .print-btn {
            background-color: #00796b;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-family: sans-serif;
            font-size: 12px;
            transition: background 0.2s;
        }
        .print-btn:hover {
            background-color: #009688;
        }

       /* --- Strict Thermal Receipt Print Layout Mapping --- */
/* --- Strict Thermal Receipt Print Layout Mapping --- */
/* --- Strict Thermal Receipt Print Layout Mapping --- */
@media print {
    @page {
        size: 58mm auto;
        margin: 0 !important; 
    }

    body * {
        display: none !important;
    }
    #print-receipt-area, #print-receipt-area * {
        display: block !important;
    }
    #print-receipt-area {
        position: relative; 
        width: 58mm;
        background: white !important;
        color: black !important;
        font-family: monospace !important;
        padding: 0;
        margin: 0;
    }
    .receipt-ticket {
        width: 58mm;
        /* Removed max-height restriction so nothing gets clipped */
        text-align: center !important; 
        display: flex;
        flex-direction: column;
        align-items: center; 
        justify-content: flex-start;
        padding: 6px 0px 12px 0px;  /* Added bottom padding to safely preserve the last line */
        box-sizing: border-box;
        
        /* Keeps your horizontal alignment fix active */
        margin-left: -4mm !important; 
    }
    .receipt-logo {
        width: 45%; /* Shrunk slightly to give text items vertical room to breathe */
        max-width: 130px;
        height: auto;
        margin: 0 auto 4px auto;
        display: block;
        filter: contrast(200%) brightness(100%);
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
    .receipt-label {
        font-size: 13px; 
        font-weight: bold;
        margin-top: 4px;
        margin-bottom: 2px;
        text-align: center;
        width: 100%;
    }
    .receipt-code {
        font-size: 28px; /* Balanced down slightly from 32px for safe wrapping */
        font-weight: bold;
        margin-bottom: 4px;
        letter-spacing: 1px;
        text-align: center;
        width: 100%;
    }
    .receipt-details {
        font-size: 15px; 
        font-weight: bold;
        margin-bottom: 6px;
        text-align: center;
        width: 100%;
    }
    .receipt-timestamp {
        font-size: 9px; 
        color: #000;
        text-align: center;
        width: 100%;
        margin-top: 2px;
        display: block !important; /* Forces it to render explicitly */
    }
}
    </style>
</head>
<body>

    <div class="database-container">
        <div class="header">
            <h1>VGWifi Voucher Database Printer</h1>
        </div>
        <div class="db-url">https://vgwifi-a5e90-default-rtdb.asia-southeast1.firebasedatabase.app</div>
        
        <div id="tiers-accordion-container">
            <div style="color: #888; padding: 10px;">Connecting to Firebase...</div>
        </div>
    </div>

    <div id="print-receipt-area" style="display: none;"></div>

<script>
        // 1. Paste your actual credentials here
        const firebaseConfig = {
            apiKey: "AIzaSyBwWuCJSjQLnIK46UVr5C3OdV__ZPL6od4",
            authDomain: "vgwifi-a5e90.firebaseapp.com",
            databaseURL: "https://vgwifi-a5e90-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "vgwifi-a5e90",
            storageBucket: "vgwifi-a5e90.firebasestorage.app",
            messagingSenderId: "681264447950",
            appId: "1:681264447950:web:96a320578b257880086b9f"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Exact format mapping text definitions
        const tierFormats = {
            "P05V": "30 MINS (P5.00)",
            "P10V": "1 HOUR (P10.00)",
            "P15V": "3 HRS (P15.00)",
            "P20V": "15 HRS (P20.00)",
            "P25V": "1 DAY (P25.00)",
            "P35V": "3 DAYS (P35.00)",
            "P50V": "7 DAYS (P50.00)"
        };

        const targetTiers = Object.keys(tierFormats);

        // Continuous sync handler
        database.ref().on('value', (snapshot) => {
            const mainContainer = document.getElementById('tiers-accordion-container');
            
            const openTiers = {};
            document.querySelectorAll('.tier-wrapper.active').forEach(el => {
                openTiers[el.dataset.tier] = true;
            });

            mainContainer.innerHTML = ''; 
            const rootData = snapshot.val() || {};

            targetTiers.forEach((tierName) => {
                const tierData = rootData[tierName] || {};
                const keys = Object.keys(tierData);
                const count = keys.length;

                const wrapper = document.createElement('div');
                wrapper.className = 'tier-wrapper';
                wrapper.dataset.tier = tierName;
                if (openTiers[tierName]) wrapper.classList.add('active');

                const header = document.createElement('div');
                header.className = 'tier-header';
                header.innerHTML = `<span>${tierFormats[tierName]}</span> <span class="tier-count">${count} items</span>`;
                
                const content = document.createElement('div');
                content.className = 'tier-content';

                const ul = document.createElement('ul');
                ul.className = 'voucher-list';

                if (count === 0) {
                    ul.innerHTML = `<li class="voucher-item" style="color: #666; justify-content: center;">No active vouchers</li>`;
                } else {
                    keys.forEach((key) => {
                        const voucherCode = tierData[key];
                        const li = document.createElement('li');
                        li.className = 'voucher-item';
                        li.innerHTML = `
                            <div>
                                <span class="key">${key}:</span> 
                                <span class="val">"${voucherCode}"</span>
                            </div>
                            <button class="print-btn" onclick="event.stopPropagation(); printAndDropVoucher('${tierName}', '${key}', '${voucherCode}')">Print</button>
                        `;
                        ul.appendChild(li);
                    });
                }

                content.appendChild(ul);
                wrapper.appendChild(header);
                wrapper.appendChild(content);
                mainContainer.appendChild(wrapper);

                if (openTiers[tierName]) {
                    content.style.maxHeight = content.scrollHeight + "px";
                }

                header.addEventListener('click', () => {
                    const isActive = wrapper.classList.toggle('active');
                    if (isActive) {
                        content.style.maxHeight = content.scrollHeight + "px";
                    } else {
                        content.style.maxHeight = "0px";
                    }
                });
            });
        }, (error) => {
            console.error(error);
            document.getElementById('tiers-accordion-container').innerHTML = `<div style="color: #ff5252; padding: 10px;">Error: ${error.message}</div>`;
        });

        // Formatted Print Engine Execution
        function printAndDropVoucher(tier, key, code) {
            const printArea = document.getElementById('print-receipt-area');
            const formatString = tierFormats[tier] || "";

            // Format real-time timestamp layout: MM-DD-YYYY (Day) HH:MM:SS
            const now = new Date();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const yyyy = now.getFullYear();
            
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const dayName = days[now.getDay()];
            
            const timeStr = now.toTimeString().split(' ')[0];
            const customTimestamp = `${mm}-${dd}-${yyyy} (${dayName}) ${timeStr}`;

            // Render exact print view with your custom image asset
            printArea.innerHTML = `
                <div class="receipt-ticket">
                    <img class="receipt-logo" src="logo.png" alt="VG Wifi Logo">
                    <div class="receipt-label">Voucher Code:</div>
                    <div class="receipt-code">${code}</div>
                    <div class="receipt-details">${formatString}</div>
                    <div class="receipt-timestamp">${customTimestamp}</div>
                </div>
            `;

            // Wait a split second to make sure Chrome loads the logo file into memory before opening the dialog box
            setTimeout(() => {
                window.print();

                // 1. Dynamically extract the localized price from the format string (e.g., extracts "P15.00" from "3 HRS (P15.00)")
                const priceMatch = formatString.match(/\(([^)]+)\)/);
                const priceLabel = priceMatch ? priceMatch[1] : tier;
				const logTimestamp = `${mm}-${dd}-${yyyy}-${timeStr}`;

                // 2. Generate the requested custom log message
                const logMessage = `${logTimestamp}: ${formatString} voucher: "${code}" manually printed and issued`;

                // 3. Get the dynamic path values based on the exact log event time
                const months = ["01-January", "02-February", "03-March", "04-April", "05-May", "06-June", "07-July", "08-August", "09-September", "10-October", "11-November", "12-December"];
                const monthFolder = months[now.getMonth()];
                const dateFolder = `${mm}-${dd}-${yyyy}`;

                const logPath = `/logs/${yyyy}/${monthFolder}/${dateFolder}`;

                // 4. Send the log entry to the RTDB, then remove the printed voucher
                database.ref(logPath).push(logMessage)
                    .then(() => {
                        console.log(`Log successfully generated at: ${logPath}`);
                        // Drop structural record element from database automatically
                        return database.ref(`${tier}/${key}`).remove();
                    })
                    .then(() => {
                        console.log(`Dropped structural element reference: ${tier}/${key}`);
                    })
                    .catch((error) => {
                        alert(`Process encountered an issue: ${error.message}`);
                    });
            }, 250);
        }
    </script>
</body>
